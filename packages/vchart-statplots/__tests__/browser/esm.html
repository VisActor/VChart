<!DOCTYPE html><html><head><meta charset="utf-8"><title>ESM smoke</title></head><body><div id="plot" style="width:500px;height:400px"></div><script type="module">
import VChart from '@visactor/vchart';
import {compileStatPlot,registerStatPlots} from '/esm/index.js';
registerStatPlots();registerStatPlots();
